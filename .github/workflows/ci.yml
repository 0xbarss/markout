name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets and run frontend tests
        run: npm ci && npm run build && npm run typecheck && npm test
        working-directory: web

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust test suite
        run: cargo test

      - name: Verify published crate contents
        run: |
          rm -rf web/node_modules
          if cargo package --list --allow-dirty | grep -vE '^(src/|web/dist/|examples/|build\.rs|Cargo\.|LICENSE|README|CONTRIBUTING|CHANGELOG|\.cargo_vcs_info)'; then
            echo "Unexpected files in cargo package list"
            exit 1
          fi

  release-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        run: npm ci && npm run build
        working-directory: web

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test cargo install from path
        run: cargo install --path . --locked

      - name: Verify installed binary
        run: markout --version

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        run: npm ci && npm run build
        working-directory: web

      - name: Set up Rust MSRV (1.88.0)
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check on MSRV
        run: cargo check --all-targets
