[package]
name = "markout-app"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["0xbarss"]
description = "Interactive financial time-series visualizer, session replay engine and live trading monitor"
license = "MIT"
repository = "https://github.com/0xbarss/markout"
homepage = "https://github.com/0xbarss/markout"
readme = "README.md"
keywords = ["trading", "visualizer", "replay", "timeseries", "parquet"]
categories = ["visualization", "command-line-utilities", "development-tools"]
include = [
    "src/**/*",
    "web/dist/**/*",
    "examples/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "CONTRIBUTING.md",
]

[lib]
name = "markout"
path = "src/lib.rs"

[[bin]]
name = "markout"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
mime_guess = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
arrow = { version = "60.0.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
