<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e11" />
  <title>markout</title>
  <script type="module" crossorigin src="/assets/index-DrqZh0Ck.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-B3qbbHTP.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">markout</div>
      <div id="symbol" class="symbol">—</div>
      <div id="tf-pills" class="pills"></div>
      <div class="spacer"></div>
      <div class="ticker"><span id="last-price">—</span><span id="last-change" class="chg"></span></div>
      <div class="stat"><span class="lbl">Equity</span><span id="equity">—</span></div>
      <div class="stat"><span class="lbl">PnL</span><span id="pnl">—</span></div>
    </header>

    <aside class="tools" aria-label="Drawing tools (coming soon)">
      <button disabled title="Crosshair">✛</button>
      <button disabled title="Trendline">/</button>
      <button disabled title="Horizontal line">─</button>
      <button disabled title="Zone">□</button>
      <button disabled title="Fibonacci">≡</button>
      <button disabled title="Measure">⤢</button>
    </aside>

    <main class="chart-area">
      <div id="legend" class="legend"></div>
      <div id="chart"></div>
      <div id="empty" class="empty" hidden>No bars loaded. Start markout with <code>--bars &lt;path&gt;</code>.</div>
      <div class="replay" aria-disabled="true">
        <button disabled>▶ Play</button><button disabled>❚❚ Pause</button>
        <button disabled>⏮</button><button disabled>⏭</button>
        <input type="range" disabled value="100" aria-label="Replay position" />
      </div>
    </main>

    <aside class="panel">
      <h3>Performance Summary</h3>
      <dl id="stats"></dl>
    </aside>

    <section class="ledger">
      <div class="tabs" id="tabs"></div>
      <div class="table-wrap"><table id="ledger"></table></div>
    </section>
  </div>
  <div id="error" class="error" hidden></div>
</body>
</html>
