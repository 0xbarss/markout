<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e11" />
  <title>Markout — Quantitative Trading Terminal</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="mobile-tools-btn" class="mobile-tools-btn" title="Drawing tools" aria-label="Toggle drawing tools">✎</button>
      <div class="brand">
        <span class="brand-icon">∿</span>
        <span class="brand-text">Markout</span>
      </div>
      <div id="symbol" class="symbol">—</div>
      <div id="tf-pills" class="pills"></div>
      <div class="spacer"></div>
      <div class="ticker"><span id="last-price">—</span><span id="last-change" class="chg"></span></div>
      <div class="stat"><span class="lbl">Equity</span><span id="equity">—</span></div>
      <div class="stat"><span class="lbl">PnL</span><span id="pnl">—</span></div>
    </header>

    <aside class="tools" aria-label="Drawing tools">
      <button id="tool-cursor" class="active" title="Crosshair / Select">✛</button>
      <button id="tool-trendline" title="Trendline">/</button>
      <button id="tool-horizontal" title="Horizontal line">─</button>
      <button id="tool-box" title="Zone box">□</button>
      <button id="tool-fibonacci" title="Fibonacci">≡</button>
      <button id="tool-position" title="Position Risk-Reward">⤢</button>
      <button id="tool-measure" title="Measure ruler">📏</button>
      <button id="tool-save" title="Save drawings">💾</button>
      <button id="tool-clear" title="Clear all drawings">🗑</button>
    </aside>


    <main class="chart-area">
      <div id="legend" class="legend"></div>
      <div id="chart"></div>
      <div id="empty" class="empty" hidden>No bars loaded. Start markout with <code>--bars &lt;path&gt;</code>.</div>
      <div class="replay" id="replay-bar">
        <button id="replay-play" title="Play / Pause">▶ Play</button>
        <button id="replay-prev" title="Step backward">⏮</button>
        <button id="replay-next" title="Step forward">⏭</button>
        <button id="replay-speed" class="speed-btn" title="Replay speed">1x</button>
        <input id="replay-slider" type="range" min="0" max="0" value="0" aria-label="Replay position" />
        <span id="replay-counter" class="counter">0 / 0</span>
        <button id="replay-live" class="live-btn" title="Jump to latest candle">Live</button>
      </div>
    </main>

    <aside class="panel">
      <h3>Performance Summary</h3>
      <dl id="stats"></dl>
    </aside>

    <section class="ledger">
      <div class="sheet-handle" id="sheet-handle" role="button" aria-label="Toggle trade sheet"><span class="handle-bar"></span></div>
      <div class="tabs" id="tabs"></div>
      <div class="table-wrap"><table id="ledger"></table></div>
    </section>
  </div>
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <div id="error" class="error" hidden></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
